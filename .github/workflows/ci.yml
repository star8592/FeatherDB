name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Storage benchmark crate
        run: |
          cargo fmt --manifest-path benchmarks/storage-backend/Cargo.toml --check
          cargo clippy --manifest-path benchmarks/storage-backend/Cargo.toml --all-targets -- -D warnings
          cargo check --manifest-path benchmarks/storage-backend/Cargo.toml

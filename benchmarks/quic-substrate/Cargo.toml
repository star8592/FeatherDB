[workspace]

[package]
name = "feather-quic-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
